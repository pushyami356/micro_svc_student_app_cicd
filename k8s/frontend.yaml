apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: student-app
spec:
  selector: {app: frontend}
  ports:
    - {port: 80, targetPort: 80}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: student-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: push356/student-frontend:6efd988c937f5b70dbe822218a6b4aa0bb03dc31
          ports:
            - {containerPort: 80}
          readinessProbe:
            tcpSocket: {port: 80}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 50m, memory: 96Mi}
